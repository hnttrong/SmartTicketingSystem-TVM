<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>02_S02_Destination_Menu</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003E7E"/>
      <stop offset="55%" stop-color="#0267A6"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#001833" flood-opacity="0.18"/>
    </filter>
    </defs>
  <rect id="Background" width="1280" height="800" fill="url(#bgGrad)"/>
  
    <circle id="Decor_TopRight" cx="1090" cy="40" r="210" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle id="Decor_BottomLeft" cx="140" cy="670" r="240" fill="#FFFFFF" fill-opacity="0.06"/>
    

  <!-- Header Bar R(0, 0, 1280, 84) in MainForm.cs -->
  <g id="Top_Header_Bar">
    <rect x="0" y="0" width="1280" height="84" fill="#06234B" fill-opacity="0.78"/>
    <line x1="0" y1="83" x2="1280" y2="83" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <g id="Metro_Badge">
