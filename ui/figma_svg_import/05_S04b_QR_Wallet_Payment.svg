<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>05_S04b_QR_Wallet_Payment</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003E7E"/>
      <stop offset="55%" stop-color="#0267A6"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#001833" flood-opacity="0.18"/>
    </filter>
    </defs>
  <rect id="Background" width="1280" height="800" fill="url(#bgGrad)"/>
  
    <circle id="Decor_TopRight" cx="1090" cy="40" r="210" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle id="Decor_BottomLeft" cx="140" cy="670" r="240" fill="#FFFFFF" fill-opacity="0.06"/>
    

  <!-- Header Bar R(0, 0, 1280, 84) in MainForm.cs -->
  <g id="Top_Header_Bar">
    <rect x="0" y="0" width="1280" height="84" fill="#06234B" fill-opacity="0.78"/>
    <line x1="0" y1="83" x2="1280" y2="83" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <g id="Metro_Badge">
      <rect x="28" y="14" width="56" height="56" rx="14" fill="#00A8B5"/>
      <text x="56" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">M1</text>
    </g>
    <text id="Header_Title" x="100" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Giao thông Thông minh TP.HCM • Tuyến Metro Số 1</text>
    <text id="Header_Subtitle" x="100" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#C8EBFA">Ga đi: Bến Thành • Máy bán vé tự động TVM-BT-01</text>
    <g id="Btn_Language_Toggle">
      <rect x="824" y="10" width="170" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
      <text x="909" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">🌐 VI / EN</text>
    </g>
    <g id="Btn_Accessibility_Toggle">
      <rect x="1008" y="10" width="244" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
      <text x="1130" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">♿ Chữ lớn / Tương phản</text>
    </g>
  </g>

  <!-- StepProgressBar R(28, 94, 1224, 58) in MainForm.cs -->
  <g id="Progress_Stepper_Bar">
    <rect x="28" y="94" width="1224" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF" stroke-width="1.5"/>
    <g id="Step_1">
      <circle cx="65" cy="123" r="15" fill="#1B7F3B"/>
      <text x="65" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="90" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F223D">1. Điểm đến</text>
    </g>
    <line x1="296" y1="123" x2="326" y2="123" stroke="#1B7F3B" stroke-width="2"/>
    <g id="Step_2">
      <circle cx="371" cy="123" r="15" fill="#1B7F3B"/>
      <text x="371" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="396" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F223D">2. Phương thức</text>
    </g>
    <line x1="602" y1="123" x2="632" y2="123" stroke="#1B7F3B" stroke-width="2"/>
    <g id="Step_3">
      <circle cx="677" cy="123" r="15" fill="#0A4988"/>
      <text x="677" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="702" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A4988">3. Thanh toán</text>
    </g>
    <line x1="908" y1="123" x2="938" y2="123" stroke="#C3D0E0" stroke-width="2"/>
    <g id="Step_4">
      <circle cx="983" cy="123" r="15" fill="#DCE4F0"/>
      <text x="983" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4E6178" text-anchor="middle">4</text>
      <text x="1008" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4E6178">4. Nhận vé</text>
    </g>
  </g>
  <rect id="S04b_QR_Payment_Panel" x="28" y="162" width="1224" height="536" rx="24" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Left QR Code Frame R(54+28=82, 62+162=224, 280, 280) -->
  <g id="S04b_QR_Code_Frame">
    <rect x="82" y="224" width="280" height="280" rx="8" fill="#FFFFFF" stroke="#B4C6DC" stroke-width="2"/>
    <!-- Finder Patterns -->
    <rect x="106" y="248" width="60" height="60" fill="none" stroke="#06234B" stroke-width="8"/>
    <rect x="122" y="264" width="28" height="28" fill="#06234B"/>
    <rect x="278" y="248" width="60" height="60" fill="none" stroke="#06234B" stroke-width="8"/>
    <rect x="294" y="264" width="28" height="28" fill="#06234B"/>
    <rect x="106" y="420" width="60" height="60" fill="none" stroke="#06234B" stroke-width="8"/>
    <rect x="122" y="436" width="28" height="28" fill="#06234B"/>
    <!-- Center Finder / Data Modules -->
    <rect x="198" y="340" width="48" height="48" rx="8" fill="#00A8B5"/>
    <rect x="184" y="256" width="18" height="18" fill="#06234B"/>
    <rect x="216" y="274" width="18" height="18" fill="#06234B"/>
    <rect x="246" y="256" width="18" height="18" fill="#06234B"/>
    <rect x="184" y="302" width="24" height="18" fill="#06234B"/>
    <rect x="256" y="340" width="18" height="36" fill="#06234B"/>
    <rect x="292" y="332" width="36" height="18" fill="#06234B"/>
    <rect x="284" y="376" width="18" height="28" fill="#06234B"/>
    <rect x="314" y="396" width="24" height="24" fill="#06234B"/>
    <rect x="184" y="408" width="28" height="18" fill="#06234B"/>
    <rect x="228" y="408" width="18" height="36" fill="#06234B"/>
    <rect x="262" y="432" width="36" height="18" fill="#06234B"/>
    <rect x="308" y="446" width="30" height="30" fill="#06234B"/>
    <rect x="190" y="458" width="52" height="18" fill="#06234B"/>
  </g>
  <text id="S04b_Provider_Badge" x="222" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A4988" text-anchor="middle">Ví Điện tử MoMo</text>

  <!-- Right Column Title & Timer -->
  <text id="S04b_Title" x="414" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F223D">Quét Mã QR để Thanh toán</text>
  <g id="S04b_Countdown_Timer">
    <rect x="978" y="182" width="242" height="64" rx="12" fill="#0F223D"/>
    <text x="1099" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">⏱ 02:00</text>
  </g>

  <!-- Right Column Prompt -->
  <text id="S04b_Step_1" x="414" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#4E6178">1. Mở ứng dụng Ngân hàng hoặc Ví điện tử (MoMo / VNPay / ZaloPay).</text>
  <text id="S04b_Step_2" x="414" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#4E6178">2. Chọn tính năng Quét Mã QR và hướng camera vào mã bên trái.</text>
  <text id="S04b_Step_3" x="414" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F223D">3. Xác nhận thanh toán — vé sẽ tự động in ngay sau khi hoàn tất.</text>

  <!-- Right Column Summary Box R(386+28=414, 282+162=444, 806, 136) -->
  <g id="S04b_Summary_Box">
    <rect x="414" y="444" width="806" height="136" rx="10" fill="#EEF4FB"/>
    <text x="432" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F223D">Mã giao dịch: TXN-20261029-01   •   Ga đến: Bến xe Suối Tiên (×2)</text>
    <text x="432" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A4988">Tổng thanh toán: 40,000 VND   •   Phương thức: Ví Điện tử (MoMo)</text>
    <text x="432" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#4E6178">Mã QR tự động hết hạn sau 120 giây (FR10 / QRPayment).</text>
  </g>
  <g id="Btn_S04b_Cancel">
    <rect x="28" y="712" width="320" height="70" rx="16" fill="#FFF5F5" stroke="#C2272D" stroke-width="2"/>
    <text x="188" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#C2272D" text-anchor="middle">✕ Hủy thanh toán</text>
  </g>
</svg>
