<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>03_S03_Payment_Mode</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003E7E"/>
      <stop offset="55%" stop-color="#0267A6"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#001833" flood-opacity="0.18"/>
    </filter>
    </defs>
  <rect id="Background" width="1280" height="800" fill="url(#bgGrad)"/>
  
    <circle id="Decor_TopRight" cx="1090" cy="40" r="210" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle id="Decor_BottomLeft" cx="140" cy="670" r="240" fill="#FFFFFF" fill-opacity="0.06"/>
    

  <!-- Header Bar R(0, 0, 1280, 84) in MainForm.cs -->
  <g id="Top_Header_Bar">
    <rect x="0" y="0" width="1280" height="84" fill="#06234B" fill-opacity="0.78"/>
    <line x1="0" y1="83" x2="1280" y2="83" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <g id="Metro_Badge">
      <rect x="28" y="14" width="56" height="56" rx="14" fill="#00A8B5"/>
      <text x="56" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">M1</text>
    </g>
    <text id="Header_Title" x="100" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Giao thông Thông minh TP.HCM • Tuyến Metro Số 1</text>
    <text id="Header_Subtitle" x="100" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#C8EBFA">Ga đi: Bến Thành • Máy bán vé tự động TVM-BT-01</text>
    <g id="Btn_Language_Toggle">
      <rect x="824" y="10" width="170" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
      <text x="909" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">🌐 VI / EN</text>
    </g>
    <g id="Btn_Accessibility_Toggle">
      <rect x="1008" y="10" width="244" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
      <text x="1130" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">♿ Chữ lớn / Tương phản</text>
    </g>
  </g>

  <!-- StepProgressBar R(28, 94, 1224, 58) in MainForm.cs -->
  <g id="Progress_Stepper_Bar">
    <rect x="28" y="94" width="1224" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF" stroke-width="1.5"/>
    <g id="Step_1">
      <circle cx="65" cy="123" r="15" fill="#1B7F3B"/>
      <text x="65" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="90" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F223D">1. Điểm đến</text>
    </g>
    <line x1="296" y1="123" x2="326" y2="123" stroke="#1B7F3B" stroke-width="2"/>
    <g id="Step_2">
      <circle cx="371" cy="123" r="15" fill="#0A4988"/>
      <text x="371" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="396" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A4988">2. Phương thức</text>
    </g>
    <line x1="602" y1="123" x2="632" y2="123" stroke="#C3D0E0" stroke-width="2"/>
    <g id="Step_3">
      <circle cx="677" cy="123" r="15" fill="#DCE4F0"/>
      <text x="677" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4E6178" text-anchor="middle">3</text>
      <text x="702" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4E6178">3. Thanh toán</text>
    </g>
    <line x1="908" y1="123" x2="938" y2="123" stroke="#C3D0E0" stroke-width="2"/>
    <g id="Step_4">
      <circle cx="983" cy="123" r="15" fill="#DCE4F0"/>
      <text x="983" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4E6178" text-anchor="middle">4</text>
      <text x="1008" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4E6178">4. Nhận vé</text>
    </g>
  </g>
  <rect id="S03_Order_Summary_Card" x="28" y="162" width="1224" height="118" rx="20" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cardShadow)"/>

  <text id="S03_Title" x="56" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#0F223D">Chọn Phương thức Thanh toán</text>
  <text id="S03_Order_Summary" x="56" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#4E6178">Hành trình: Bến Thành → Bến xe Suối Tiên  •  Số lượng: 2 vé (20,000 VND/vé)</text>
  <text id="S03_Order_Total" x="1224" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4988" text-anchor="end">40,000 VND</text>
  <rect id="S03_Payment_Modes_Card" x="28" y="294" width="1224" height="404" rx="22" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cardShadow)"/>
  <g id="Btn_Mode_Card">
    <rect x="56" y="322" width="376" height="348" rx="20" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="2"/>
    <text x="244" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#0F223D" text-anchor="middle">💳</text>
    <text x="244" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F223D" text-anchor="middle">Thẻ Tín dụng / Ghi nợ</text>
    <text x="244" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#4E6178" text-anchor="middle">Chạm NFC hoặc Cắm thẻ Chip EMV</text>
    <text x="244" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4E6178" text-anchor="middle">Visa • Mastercard • JCB • Napas</text>
  </g>
  <g id="Btn_Mode_BankQR">
    <rect x="452" y="322" width="376" height="348" rx="20" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="2"/>
    <text x="640" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#0F223D" text-anchor="middle">🏦</text>
    <text x="640" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F223D" text-anchor="middle">Mã QR Ngân hàng</text>
    <text x="640" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#4E6178" text-anchor="middle">Quét mã VietQR Napas 247</text>
    <text x="640" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4E6178" text-anchor="middle">Hỗ trợ 40+ ứng dụng Ngân hàng</text>
  </g>
  <g id="Btn_Mode_EWallet">
    <rect x="848" y="322" width="376" height="292" rx="20" fill="#0A4988" stroke="#0A4988" stroke-width="2"/>
    <text x="1036" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle">📱</text>
    <text x="1036" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ví Điện tử</text>
    <text x="1036" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#E0F2FE" text-anchor="middle">Quét mã QR bằng Ví điện tử</text>
    <text x="1036" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#E0F2FE" text-anchor="middle">MoMo • VNPay • ZaloPay</text>
  </g>

  <!-- Wallet Provider Selector (_lblS03WalletBrand + _cboWalletBrand in MainForm.cs) -->
  <g id="S03_Wallet_Provider_Selector">
    <text x="998" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F223D" text-anchor="end">Chọn Ví:</text>
    <rect x="1012" y="628" width="212" height="44" rx="10" fill="#FFFFFF" stroke="#0A4988" stroke-width="2"/>
    <text x="1028" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F223D">MoMo</text>
    <text x="1200" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0A4988" text-anchor="middle">▼</text>
  </g>
  <g id="Btn_S03_Cancel">
    <rect x="28" y="712" width="220" height="70" rx="16" fill="#FFF5F5" stroke="#C2272D" stroke-width="2"/>
    <text x="138" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#C2272D" text-anchor="middle">✕ Hủy giao dịch</text>
  </g>
  <g id="Btn_S03_Back">
    <rect x="264" y="712" width="240" height="70" rx="16" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="2"/>
    <text x="384" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F223D" text-anchor="middle">← Đổi ga đến</text>
  </g>
  <g id="Btn_S03_Proceed">
    <rect x="872" y="712" width="380" height="70" rx="16" fill="#0A4988" stroke="#0A4988" stroke-width="0"/>
    <text x="1062" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tiến hành Thanh toán  →</text>
  </g>
</svg>
